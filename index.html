<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PAPANGAT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 30px 15px 25px;
    }

    h1 {
      margin-bottom: 7px;
      font-size: 30px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
    }

    /* GALERI */
    .gallery {
      max-width: 1000px;
      margin: auto;
      padding: 0 15px 40px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.25s;
    }

    .photo:hover {
      transform: scale(1.04);
      opacity: 0.85;
    }

    /* VIEWER FOTO BESAR */
    .viewer {
      display: none;
      position: fixed;
      z-index: 999;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);

      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .viewer img {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 40px;
      cursor: pointer;
      color: white;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #222;
      background: #08080b;
      text-align: center;
      padding: 25px 15px;
      margin-top: 10px;
    }

    .footer-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .footer-text {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .copyright {
      color: #444;
      font-size: 11px;
    }

    /* HP */
    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        padding: 0 10px 30px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
